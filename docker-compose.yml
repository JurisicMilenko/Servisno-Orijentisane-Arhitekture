version: '3.9'

# Docker Compose konfiguracija za SOA projekat
# Konfiguracija dodata: 9. decembar 2025
# Ažurirano: 18. januar 2026 - dodati monitoring servisi
# 
# Servisi:
#   Baze podataka: PostgreSQL, MongoDB, Neo4j
#   Backend servisi: backend, stakeholders, tours, purchase, gateway
#   Frontend: nginx servis
#   .NET servisi: blog-service, followers (gRPC problem na ARM64)
#   Monitoring: Jaeger, Prometheus, Grafana, Loki, Promtail, cAdvisor, node-exporter
#
# Pokretanje: docker compose up -d
# Zaustavljanje: docker compose down
# Provera: docker compose ps

services:
  # PostgreSQL baza za stakeholders servis (user management)
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: soa_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/data/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - '5432:5432'
    networks:
      - soa-net

  smart-tutor-migration:
    build:
      dockerfile: Dockerfile
      context: ./BlogService
      target: execute-migration
    environment:
      DATABASE_HOST: postgres
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_SCHEMA: soa_demo
    depends_on:
      - postgres
    networks:
      - soa-net

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: tours_db
    volumes:
      - mongo_data:/data/db
    networks:
      - soa-net
    ports:
      - '27017:27017'

  neo4j:
    image: neo4j:5.20
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/super123
    volumes:
      - neo4j-data:/data
    networks:
      - soa-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: soa_demo
      PGPORT: 5432
      JWT_SECRET: change-me-in-prod
      FOLLOWERS_GRPC_SERVICE_URL: followers:5001
    volumes:
      - ./backend/data:/usr/src/app/data
    depends_on:
      - postgres
      - smart-tutor-migration
    networks:
      - soa-net

  stakeholders:
    build:
      context: ./stakeholders
      dockerfile: Dockerfile
    environment:
      JWT_SECRET: change-me-in-prod
      NODE_ENV: production
      PORT: 3001
    networks:
      - soa-net

  tours:
    build:
      context: .
      dockerfile: tours/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGO_URI: mongodb://mongodb:27017/tours_db
      JWT_SECRET: change-me-in-prod
      # Monitoring
      SERVICE_NAME: tours-service
      JAEGER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      LOG_LEVEL: info
    depends_on:
      - mongodb
    networks:
      - soa-net

  purchase:
    build:
      context: .
      dockerfile: purchase/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3004
      MONGO_URI: mongodb://mongodb:27017/purchase_db
      JWT_SECRET: change-me-in-prod
      # Monitoring
      SERVICE_NAME: purchase-service
      JAEGER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      LOG_LEVEL: info
    depends_on:
      - mongodb
    networks:
      - soa-net

  blog-service:
    build:
      context: ./BlogService
      dockerfile: Dockerfile
      target: final
    environment:
      ASPNETCORE_URLS: "http://+:80"
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_SCHEMA: soa_demo
    depends_on:
      - postgres
      - smart-tutor-migration
    ports:
      - "8083:80"
      - "50051:50051"
    networks:
      - soa-net

  followers:
    build:
      context: ./FollowerService
      dockerfile: Dockerfile
    container_name: followers
    depends_on:
      - neo4j
    ports:
      - "5001:5001"
      - "8085:80"
    environment:
      JWT_SECRET: change-me-in-prod
      NEO4J_BOLT_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: super123
    networks:
      - soa-net

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      NODE_ENV: production
      JWT_SECRET: change-me-in-prod
      PORT: 4000
      AUTH_SERVICE_URL: http://backend:3000
      ATTRACTIONS_SERVICE_URL: http://backend:3000
      STAKEHOLDERS_SERVICE_URL: http://stakeholders:3001
      TOURS_SERVICE_URL: http://tours:3002
      PURCHASE_SERVICE_URL: http://purchase:3004
      BLOG_SERVICE_URL: http://blog-service:80
      BLOG_RATING_GRPC: blog-service:50051
      FOLLOWERS_SERVICE_URL: http://followers:8080
      # Monitoring
      SERVICE_NAME: gateway
      JAEGER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      LOG_LEVEL: info
    ports:
      - '4000:4000'
    depends_on:
      - backend
      - stakeholders
      - tours
      - purchase
      - blog-service
      - followers
    networks:
      - soa-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '8080:80'
    environment:
      API_BASE: http://gateway:4000
    networks:
      - soa-net

  # ========== MONITORING STACK ==========
  
  # Jaeger - distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - soa-net

  # Prometheus - metrics collection
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - soa-net

  # Grafana - visualization
  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - soa-net

  # Loki - log aggregation
  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - soa-net

  # Promtail - log shipper
  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - soa-net

  # cAdvisor - container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - soa-net

  # Node Exporter - host metrics
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks:
      - soa-net

volumes:
  postgres_data:
  mongo_data:
  neo4j-data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  soa-net:
    driver: bridge
