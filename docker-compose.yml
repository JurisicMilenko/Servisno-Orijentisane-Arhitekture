version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: soa_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # initialize DB with schema from backend
      - ./backend/data/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - soa-net

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: tours_db
    volumes:
      - mongo_data:/data/db
    networks:
      - soa-net
    ports:
      - '27017:27017'

  neo4j:
    image: neo4j:5.20
    container_name: neo4j
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt protocol used by the app
    environment:
      NEO4J_AUTH: neo4j/super123
    volumes:
      - neo4j-data:/data
    networks:
      - soa-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: soa_demo
      PGPORT: 5432
      JWT_SECRET: change-me-in-prod
    volumes:
      - ./backend/data:/usr/src/app/data
    depends_on:
      - postgres
    networks:
      - soa-net

  stakeholders:
    build:
      context: ./stakeholders
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
    networks:
      - soa-net

  tours:
    build:
      context: ./tours
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGO_URI: mongodb://mongodb:27017/tours_db
      JWT_SECRET: change-me-in-prod
    depends_on:
      - mongodb
    networks:
      - soa-net

  blog:
    build:
      context: ./blog
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3003
    networks:
      - soa-net

  followers:
    build:
      context: ./FollowerService
      dockerfile: Dockerfile
    container_name: followers
    depends_on:
      - neo4j
    ports:
      - "8085:80"   # adjust if needed
    environment:
      NEO4J_BOLT_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: super123
    networks:
    - soa-net

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      AUTH_SERVICE_URL: http://backend:3000
      ATTRACTIONS_SERVICE_URL: http://backend:3000
      STAKEHOLDERS_SERVICE_URL: http://stakeholders:3001
      TOURS_SERVICE_URL: http://tours:3002
      BLOG_SERVICE_URL: http://blog:3003
      FOLLOWERS_SERVICE_URL: http://followers:80
    ports:
      - '4000:4000'
    depends_on:
      - backend
      - stakeholders
      - tours
      - blog
      - followers
    networks:
      - soa-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '8080:80'
    environment:
      API_BASE: http://localhost:4000
    networks:
      - soa-net

volumes:
  postgres_data:
  mongo_data:
  neo4j-data:

networks:
  soa-net:
    driver: bridge
