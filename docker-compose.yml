version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: soa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: soa_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # initialize DB with schema from backend
      - ./backend/data/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soa-net

  mongodb:
    image: mongo:8.0
    container_name: soa_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: tours_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soa-net
    ports:
      - '27017:27017'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soa_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: soa_demo
      PGPORT: 5432
      JWT_SECRET: change-me-in-prod
    volumes:
      - ./backend/data:/usr/src/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - soa-net

  stakeholders:
    build:
      context: ./stakeholders
      dockerfile: Dockerfile
    container_name: soa_stakeholders
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - soa-net

  tours:
    build:
      context: ./tours
      dockerfile: Dockerfile
    container_name: soa_tours
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGO_URI: mongodb://mongodb:27017/tours_db
      JWT_SECRET: change-me-in-prod
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - soa-net

  blog:
    build:
      context: ./blog
      dockerfile: Dockerfile
    container_name: soa_blog
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - soa-net

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: soa_gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      AUTH_SERVICE_URL: http://backend:3000
      ATTRACTIONS_SERVICE_URL: http://backend:3000
      STAKEHOLDERS_SERVICE_URL: http://stakeholders:3001
      TOURS_SERVICE_URL: http://tours:3002
      BLOG_SERVICE_URL: http://blog:3003
    ports:
      - '4000:4000'
    depends_on:
      backend:
        condition: service_healthy
      stakeholders:
        condition: service_healthy
      tours:
        condition: service_healthy
      blog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - soa-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soa_frontend
    restart: unless-stopped
    ports:
      - '8080:80'
    environment:
      API_BASE: http://localhost:4000
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - soa-net

volumes:
  postgres_data:
  mongo_data:

networks:
  soa-net:
    driver: bridge
