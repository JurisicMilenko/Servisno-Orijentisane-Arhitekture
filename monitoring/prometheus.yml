global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Node.js services
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:4000']
    metrics_path: '/metrics'

  - job_name: 'backend'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/metrics'

  - job_name: 'tours'
    static_configs:
      - targets: ['tours:3002']
    metrics_path: '/metrics'

  - job_name: 'stakeholders'
    static_configs:
      - targets: ['stakeholders:3001']
    metrics_path: '/metrics'

  - job_name: 'purchase'
    static_configs:
      - targets: ['purchase:3004']
    metrics_path: '/metrics'

  # Container metrics from cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Host metrics from node-exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
