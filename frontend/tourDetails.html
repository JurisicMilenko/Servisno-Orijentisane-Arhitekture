<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Detalji Ture</title>
  <link rel="stylesheet" href="./style.css">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
  
  <style>
    /* Keep Leaflet zoom controls below navbar */
    .leaflet-control-zoom {
      z-index: 999 !important;
    }
    
    #tourMap {
      height: 600px;
      width: 100%;
      border-radius: 8px;
      margin-top: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .key-points-section {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
    }
    
    .key-points-list {
      display: grid;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    
    .key-point-item {
      background: white;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .key-point-number {
      background: #667eea;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    
    .key-point-content {
      flex: 1;
    }
    
    .key-point-content h5 {
      margin: 0 0 0.25rem 0;
      font-size: 0.95rem;
      color: #333;
    }
    
    .key-point-content p {
      margin: 0;
      font-size: 0.85rem;
      color: #666;
    }
    
    .map-instructions {
      background: #e3f2fd;
      border-left: 4px solid #2196f3;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: #1565c0;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="navbar">
      <h2>🗺️ Detalji Ture</h2>
      <div class="navbar-menu">
        <button id="backBtn" class="nav-link">⬅️ Nazad</button>
        <button id="homeBtn" class="nav-link">🏠 Početna</button>
      </div>
    </nav>

    <div id="messageArea" class="message"></div>

    <div id="tourContent" style="display:none;">
      <!-- Tour Header -->
      <div class="tour-detail-header">
        <h1 id="tourName"></h1>
        <div class="tour-meta">
          <span id="tourStatus" class="status-badge"></span>
          <span class="tour-price" id="tourPrice"></span>
        </div>
      </div>

      <!-- Tour Info Grid -->
      <div class="tour-info-grid">
        <div class="info-card">
          <div class="info-label">📍 Težina</div>
          <div class="info-value" id="tourDifficulty"></div>
        </div>
        <div class="info-card">
          <div class="info-label">⏱️ Trajanje</div>
          <div class="info-value" id="tourDuration"></div>
        </div>
        <div class="info-card">
          <div class="info-label">📏 Distanca</div>
          <div class="info-value" id="tourDistance"></div>
        </div>
        <div class="info-card">
          <div class="info-label">📍 Kontrolne Tačke</div>
          <div class="info-value" id="keyPointsCount"></div>
        </div>
      </div>

      <!-- Description -->
      <div class="tour-section">
        <h3>📝 Opis</h3>
        <p id="tourDescription" class="tour-description"></p>
      </div>

      <!-- Tags -->
      <div class="tour-section" id="tagsSection" style="display:none;">
        <h3>🏷️ Oznake</h3>
        <div id="tourTags" class="tour-tags"></div>
      </div>

      <!-- Key Points Section -->
      <div class="tour-section">
        <h3>📍 Kontrolne Tačke</h3>
        <button id="showMapBtn" class="btn btn-primary" style="margin-right: 0.5rem;">
          <span id="mapToggle">Prikaži</span> Mapu
        </button>
        <button id="showKeyPointsBtn" class="btn btn-secondary">
          <span id="keyPointsToggle">Prikaži</span> Listu
        </button>
        
        <div id="mapContainer" class="key-points-section" style="display:none; margin-top: 20px;">
          <div class="map-instructions">
            💡 Mapa prikazuje kontrolne tačke i rutu između njih.
          </div>
          <div id="tourMap"></div>
        </div>
        
        <div id="keyPointsContainer" class="key-points-section" style="display:none; margin-top: 20px;">
          <div id="keyPointsList" class="key-points-list"></div>
        </div>
      </div>

      <!-- Tour Metadata -->
      <div class="tour-section">
        <h3>ℹ️ Dodatne Informacije</h3>
        <div class="tour-metadata">
          <p><strong>Autor ID:</strong> <span id="authorId"></span></p>
          <p><strong>Kreirana:</strong> <span id="createdAt"></span></p>
          <p><strong>Poslednja izmena:</strong> <span id="updatedAt"></span></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

  <script src="./js/config.js?v=20251118"></script>
  <script src="./js/tourDetails.js?v=20251118"></script>
</body>
</html>
