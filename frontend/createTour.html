<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kreiraj Turu</title>
  <!-- Prevent caching during development -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="./style.css?v=20251112">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="navbar-container">
      <div class="navbar-brand">
        <h1>🌍 Turistička Aplikacija</h1>
      </div>
      <div class="navbar-menu">
        <button id="homeBtn" class="nav-link">🏠 Početna</button>
        <button id="profileBtn" class="nav-link">👤 Profil</button>
        <button id="logoutBtn" class="nav-link logout-btn">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="tour-create-container">
      <h2>Kreiraj Novu Turu</h2>
      <p class="info-text">Popunite osnovne informacije o turi. Nakon kreiranja, moći ćete da dodate ključne tačke.</p>
      
      <div id="message" class="message" style="display:none;"></div>
      
      <form id="createTourForm" class="tour-form">
        <div class="form-group">
          <label for="tourName">Naziv Ture *</label>
          <input type="text" id="tourName" name="name" required placeholder="Npr. Stara Varoš - Turistička šetnja">
        </div>

        <div class="form-group">
          <label for="tourDescription">Opis Ture *</label>
          <textarea id="tourDescription" name="description" rows="5" required placeholder="Detaljan opis ture..."></textarea>
        </div>

        <div class="form-group">
          <label for="tourDifficulty">Težina</label>
          <select id="tourDifficulty" name="difficulty">
            <option value="easy">Lako</option>
            <option value="medium" selected>Srednje</option>
            <option value="hard">Teško</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tourTags">Tagovi (odvojeni zarezom)</label>
          <input type="text" id="tourTags" name="tags" placeholder="Npr. kultura, istorija, priroda">
          <small>Tagovi pomažu korisnicima da pronađu vašu turu</small>
        </div>

        <div class="form-group">
          <label for="tourDuration">Trajanje (sati)</label>
          <input type="number" id="tourDuration" name="duration" min="0" step="0.5" placeholder="Npr. 2.5">
          <small>Koliko vremena je potrebno da se tura završi</small>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Kreiraj Turu</button>
          <button type="button" id="cancelBtn" class="btn btn-secondary">Otkaži</button>
        </div>
      </form>

      <div id="tourCreatedInfo" class="tour-created-info" style="display:none;">
        <h3>✓ Tura Uspješno Kreirana!</h3>
        <p>Status: <strong>Draft</strong> | Cena: <strong>0</strong></p>
        
          <button id="viewMyToursBtn" class="btn btn-secondary">Moje Ture</button>
        </div>
      </div>
    </div>
  </main>

  <script src="./js/config.js?v=20251118"></script>
  <script src="./js/createTour.js?v=20251118"></script>
</body>
</html>
