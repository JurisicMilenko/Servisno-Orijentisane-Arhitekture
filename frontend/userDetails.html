<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Moji Podaci — Turistička aplikacija</title>
  <!-- Prevent caching during development -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="./style.css?v=20251111">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="navbar-container">
      <div class="navbar-brand">
        <h1>🌍 Turistička Aplikacija</h1>
      </div>
      <div class="navbar-menu">
        <button id="homeBtn" class="nav-link">🏠 Početna</button>
        <button id="adminBtn" class="nav-link" style="display:none;">⚙️ Admin Panel</button>
        <button id="logoutBtn" class="nav-link logout-btn">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="profile-container">
      <h2>Moji Podaci</h2>
      
      <!-- Profile Display -->
      <div id="profileDisplay" class="profile-display">
        <div class="profile-header">
          <div class="profile-avatar">
            <img id="profileImg" src="https://via.placeholder.com/150" alt="Avatar" />
          </div>
          <div class="profile-info">
            <h3 id="profileUsername">...</h3>
            <p id="profileRole">Turist</p>
            <p id="profileEmail">...</p>
          </div>
        </div>

        <div class="profile-details">
          <div class="detail-row">
            <span class="label">Ime:</span>
            <span id="profileFirstName">-</span>
          </div>
          <div class="detail-row">
            <span class="label">Prezime:</span>
            <span id="profileLastName">-</span>
          </div>
          <div class="detail-row">
            <span class="label">Motiv:</span>
            <span id="profileMotto">-</span>
          </div>
          <div class="detail-row">
            <span class="label">Biografija:</span>
            <span id="profileBio">-</span>
          </div>
        </div>

        <button id="editProfileBtn" class="btn btn-primary">Uredi Profil</button>
      </div>

      <!-- Profile Edit Form -->
      <form id="profileEditForm" class="profile-form" style="display:none;">
        <h3>Uredi Profil</h3>
        
        <div class="form-group">
          <label for="editEmail">Email:</label>
          <input type="email" id="editEmail" name="email" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="editFirstName">Ime:</label>
            <input type="text" id="editFirstName" name="first_name" />
          </div>
          <div class="form-group">
            <label for="editLastName">Prezime:</label>
            <input type="text" id="editLastName" name="last_name" />
          </div>
        </div>

        <div class="form-group">
          <label for="editAvatarUrl">URL Slike Profila:</label>
          <input type="url" id="editAvatarUrl" name="avatar_url" placeholder="https://..." />
        </div>

        <div class="form-group">
          <label for="editMotto">Motiv:</label>
          <input type="text" id="editMotto" name="motto" placeholder="Vaš motiv..." />
        </div>

        <div class="form-group">
          <label for="editBio">Biografija:</label>
          <textarea id="editBio" name="bio" rows="4" placeholder="Napišite nešto o sebi..."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-success">Spremi</button>
          <button type="button" id="cancelEditBtn" class="btn btn-secondary">Otkaži</button>
        </div>
        <div id="editMessage"></div>
      </form>
    </div>
  </main>

  <script src="./js/config.js?v=20251111" defer></script>
  <script src="./js/userDetails.js?v=20251111" defer></script>
</body>
</html>
